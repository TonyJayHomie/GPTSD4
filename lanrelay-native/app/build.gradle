plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanrelay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lanrelay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
